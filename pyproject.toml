[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbcli"
version = "0.1.0"
description = "Recipe-first CSV/XLSX to MySQL loading CLI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "polars>=1.0,<2.0",
  "PyMySQL>=1.1,<2.0",
  "python-calamine>=0.2,<1.0",
  "PyYAML>=6,<7",
  "SQLAlchemy>=2.0,<3.0",
  "typer>=0.12,<1.0",
]

[dependency-groups]
dev = [
  "build>=1,<2",
  "pytest>=8,<9",
]

[project.scripts]
dbcli = "dbcli.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["dbcli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "mysql: tests that require DBCLI_MYSQL_INTEGRATION_URL and a live MySQL server",
]
